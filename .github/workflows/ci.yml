name: CI

on:
  push:
    branches: ["**"]
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  engine:
    name: RunTogetherKit
    # macOS because the engine is the training logic for an iOS app and should
    # be verified on the toolchain that will actually ship it.
    runs-on: macos-latest

    steps:
      - uses: actions/checkout@v4

      - name: Toolchain
        run: swift --version

      - name: Build
        run: swift build --package-path RunTogetherKit

      - name: Test
        run: swift test --package-path RunTogetherKit

  app:
    name: RunTogether (iOS)
    runs-on: macos-latest

    steps:
      - uses: actions/checkout@v4

      - name: Available SDKs
        run: xcodebuild -showsdks | grep -i ios || true

      # Simulator destination and signing disabled: this job is here to catch
      # compile errors, not to produce an installable build.
      - name: Build
        run: |
          xcodebuild build \
            -project RunTogether/RunTogether.xcodeproj \
            -scheme RunTogether \
            -destination 'generic/platform=iOS Simulator' \
            -configuration Debug \
            CODE_SIGNING_ALLOWED=NO
